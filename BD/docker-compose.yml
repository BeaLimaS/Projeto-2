version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    networks:
      - appnet

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - appnet
    depends_on:
      - backend

networks:
  appnet:
