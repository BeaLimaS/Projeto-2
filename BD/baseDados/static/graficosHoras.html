<html lang="pt">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/main.min.css" rel="stylesheet">

    <main>
        <h1>Gráficos Horas</h1>
        <p>Apresentamos, num determinado dia, o gráfico da hora de início dos carregamentos.</p>
        <div id="calendarioHoras"></div>

        <input type="date" id="dataSelecionada" onchange="atualizarGraficoPorDia()">
        <div id="graficoPorDia"></div>
        <p>NOTA: Nem todos os dias podem ter dados a apresentar. </p>
    </main>
