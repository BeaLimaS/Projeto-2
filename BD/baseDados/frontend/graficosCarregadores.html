<body>
    <nav>
        <ul>
            <li><a href="index.html">Página Inicial</a></li>
            <li><a href="graficosHoras.html">Gráficos Horas</a></li>

    <main>
        <h1>Gráficos por Carregador</h1>

        <div style="position: relative; width: 100%; height: 20px; margin-top: 20px;">
            <div style="position: absolute; top: 0; left: 10px; right: 10px; display: flex; align-items: flex-start; gap: 10px;">
        <label for="pesquisaIdCarregador">Procurar Carregador:</label>
        <input type="text" id="pesquisaIdCarregador" oninput="filtrarOpcoes()" placeholder="Digite o ID da tag...">
        </div>
    </div>

        <div style="position: relative; width: 100%; height: 20px; margin-top: 20px;">
            <div style="position: absolute; top: 0; left: 10px; right: 10px; display: flex; align-items: flex-start; gap: 10px;">
              <label for="selecionadorIdCarregador" style="margin: 0; padding-top: 5px;">Selecionar Carregador:</label>
              <select id="selecionadorIdCarregador" style="position: relative; z-index: 9999;" onchange="atualizarGraficoSelecionado()" onclick="fecharSelecionador()" size="1">
                <option value="">-- Selecione um Carregador --</option>
              </select>
            </div>
          </div>
          
          
          
        <div id="graficoCarregadorSelecionada" style="margin-top: 20px;"></div>
